---
version: '3'

dotenv:
  - .secrets
  - .env

vars:
  GITHUB_TOKEN_NAME: GITHUB_TOKEN
  CAMALOT_ACTIONS_VERSION: v1

# includes:
#   codeql:
#     taskfile: 'https://raw.githubusercontent.com/camalot/actions/refs/tags/{{.CAMALOT_ACTIONS_VERSION}}/smells/codeql/Taskfile.yml'
#     flatten: true
#     internal: true

tasks:
  require-xget:
    silent: true
    internal: true
    desc: Ensure xget is installed in the system PATH
    cmds:
      - command -v xget >/dev/null 2>&1 || { echo "xget is required but not installed"; exit 1; }

  tools:verify:
    silent: true
    internal: true
    desc: Verify required tools are installed
    cmds:
      - command -v pnpm >/dev/null 2>&1 || { echo >&2 "pnpm is required but it's not installed. Aborting."; exit 1; }
      - command -v node >/dev/null 2>&1 || { echo >&2 "node is required but it's not installed. Aborting."; exit 1; }

  tools:typos:
    internal: true
    deps:
      - require-xget
      - tools:verify
    desc: Install typos
    if: '! command -v typos >/dev/null 2>&1'
    status:
      - '! command -v typos >/dev/null 2>&1'
    cmds:
      - xget install crate-ci/typos --to ~/.local/bin/ --non-interactive

  typos:check:
    deps:
      - tools:typos
    desc: Check for typos
    cmds:
      - typos --config .typos.toml

  pre-commit:
    deps:
      - tools:verify
    desc: Run pre-commit checks
    cmds:
      - task: format:fix
      - task: typos:check
      - task: lint:fix
      - task: build
      - task: test:coverage

  lint:check:
    deps:
      - tools:verify
    desc: Lint the project
    cmds:
      - pnpx eslint "**/*.ts" --config .github/linters/eslint.config.js

  lint:fix:
    deps:
      - tools:verify
    desc: Fix lint issues
    cmds:
      - pnpx eslint "**/*.ts" --fix --config .github/linters/eslint.config.js

  test:coverage:
    deps:
      - tools:verify
    desc: Run tests with coverage
    cmds:
      - node --experimental-vm-modules ./node_modules/jest/bin/jest.js --runInBand --coverage
      # - pnpx jest --coverage --runInBand

  codeql:
    desc: Run CodeQL analysis on the project
    cmds:
      - task: codeql:actions:.
      - task: codeql:javascript:src

  build:
    deps:
      - tools:verify
    desc: Build the project using the canonical Linux environment
    cmds:
      - cmd: pnpm run build
        platforms: [linux]
      - cmd: >-
          docker run --rm
          --mount "type=bind,source={{.ROOT_DIR}},target=/workspace"
          --mount type=volume,target=/workspace/node_modules
          --workdir /workspace
          node:26.12.0-bookworm-slim
          sh -ec "npm install --global pnpm@12.14.0 &&
          pnpm install --frozen-lockfile &&
          pnpm run build"
        platforms: [windows, darwin]

  ci:
    deps:
      - tools:verify
    desc: Run continuous integration tasks
    cmds:
      - task: format:check
      - task: typos:check
      - task: lint:check
      - task: test:coverage
      - task: build

  format:fix:
    deps:
      - tools:verify
    desc: Format the project
    cmds:
      - pnpx prettier --no-error-on-unmatched-pattern --write "**/*.{ts,yml,yaml}"

  format:check:
    deps:
      - tools:verify
    desc: Check the format of the project
    cmds:
      - pnpx prettier --no-error-on-unmatched-pattern --check "**/*.{ts,yml,yaml}"
