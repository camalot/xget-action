---
version: '3'

dotenv:
  - .secrets
  - .env

vars:
  GITHUB_TOKEN_NAME: GITHUB_TOKEN

includes:
  codeql: 
    # as git over ssh
    #taskfile: 'git@github.com:camalot/actions.git//smells/codeql/TaskFile.yml?ref=main'
    # as https
    # taskfile: https://github.com/camalot/actions/raw/refs/heads/main/smells/codeql/TaskFile.yml
    # as git over https
    taskfile: https://github.com/camalot/actions.git//smells/codeql/TaskFile.yml?ref=main
    flatten: true

tasks:
  require-xget:
    silent: true
    internal: true
    desc: Ensure xget is installed in the system PATH
    cmds:
      - command -v xget >/dev/null 2>&1 || { echo "xget is required but not installed"; exit 1; }

  tools:verify:
    silent: true
    internal: true
    desc: Verify required tools are installed
    cmds:
      - command -v pnpm >/dev/null 2>&1 || { echo >&2 "pnpm is required but it's not installed. Aborting."; exit 1; }
      - command -v node >/dev/null 2>&1 || { echo >&2 "node is required but it's not installed. Aborting."; exit 1; }

  tools:typos:
    internal: true
    deps:
      - require-xget
      - tools:verify
    desc: Install typos
    if: '! command -v typos >/dev/null 2>&1'
    status:
      - '! command -v typos >/dev/null 2>&1'
    cmds:
      - xget install crate-ci/typos --to ~/.local/bin/ --non-interactive

  typos:check:
    deps:
      - tools:typos
    desc: Check for typos
    cmds:
      - typos --config .typos.toml

  pre-commit:
    deps:
      - tools:verify
    desc: Run pre-commit checks
    cmds:
      - task: format:fix
      - task: typos:check
      - task: lint:fix
      - task: build
      - task: test:coverage

  lint:check:
    deps:
      - tools:verify
    desc: Lint the project
    cmds:
      - pnpx eslint "**/*.ts" --config .github/linters/eslint.config.js

  lint:fix:
    deps:
      - tools:verify
    desc: Fix lint issues
    cmds:
      - pnpx eslint "**/*.ts" --fix --config .github/linters/eslint.config.js

  test:coverage:
    deps:
      - tools:verify
    desc: Run tests with coverage
    cmds:
      - node --experimental-vm-modules ./node_modules/jest/bin/jest.js --runInBand --coverage
      # - pnpx jest --coverage --runInBand

  codeql:
    cmds:
      - task: codeql:actions:.
      - task: codeql:javascript:src

  build:
    deps:
      - tools:verify
    desc: Build the project
    cmds:
      - pnpx @vercel/ncc build --minify -o dist/setup src/setup-xget.ts
      - pnpx @vercel/ncc build --minify -o dist/cache-save src/cache-save.ts

  ci:
    deps:
      - tools:verify
    desc: Run continuous integration tasks
    cmds:
      - task: format:check
      - task: typos:check
      - task: lint:check
      - task: test:coverage
      - task: build

  format:fix:
    deps:
      - tools:verify
    desc: Format the project
    cmds:
      - pnpx prettier --no-error-on-unmatched-pattern --write "**/*.{ts,yml,yaml}"

  format:check:
    deps:
      - tools:verify
    desc: Check the format of the project
    cmds:
      - pnpx prettier --no-error-on-unmatched-pattern --check "**/*.{ts,yml,yaml}"
